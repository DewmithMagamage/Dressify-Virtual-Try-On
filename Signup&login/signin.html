<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login and Signup</title>
  <link rel="stylesheet" href="/signup/Login.css">
</head>
<body>
  <div class="container">
    <div class="form-container">
      <h2>Create Account</h2>
      <div class="social-login">
        <button class="social-btn google">
          <img src="/IMAGES/google.png" alt="Google"> Sign up with Google
        </button>
        <button class="social-btn facebook">
          <img src="/IMAGES/facebook.png" alt="Facebook"> Sign up with Facebook
        </button>
      </div>
      <div class="divider">- OR -</div>
      <form action="#">
        <div class="input-field">
          <input type="text" id="full-name" placeholder="Full Name">
        </div>
        <div class="input-field">
          <input type="email" id="email" placeholder="Email Address">
        </div>
        <div class="input-field">
          <input type="password" id="password" placeholder="Password">
        </div>
        <div class="input-field">
          <input type="password" id="confirm-password" placeholder="Confirm Password">
        </div>
        <br>
        <br>
        <button type="submit" class="submit-btn">Create Account</button>
      </form>
      <br>
      <p class="login-link">Already have an account? <a href="#">Log in</a></p>
    </div>
  </div>
  <script src="/signup/Login.js"></script>
</body>
</html>
