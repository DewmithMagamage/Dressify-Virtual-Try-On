<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>
  <link rel="stylesheet" href="/shop/shop.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="Logo">
    </div>
    <h2>Shop</h2>
    <div id="cart-container">
      <button id="view-cart" onclick="showCart()">🛒 View Cart (<span id="cart-count">0</span>)</button>
    </div>
    <div class="product-grid">
      <!-- Product 1 -->
      <div class="product">
        <img src="product1.jpg" alt="Product 1">
        <h3>Product 1</h3>
        <p>$10.00</p>
        <button class="action-btn add-to-cart" onclick="addToCart('Product 1', 10)">Add to Cart</button>
        <button class="action-btn try-on">Try On</button>
      </div>
      <!-- Product 2 -->
      <div class="product">
        <img src="product2.jpg" alt="Product 2">
        <h3>Product 2</h3>
        <p>$15.00</p>
        <button class="action-btn add-to-cart" onclick="addToCart('Product 2', 15)">Add to Cart</button>
        <button class="action-btn try-on">Try On</button>
      </div>
      <!-- Product 3 -->
      <div class="product">
        <img src="product3.jpg" alt="Product 3">
        <h3>Product 3</h3>
        <p>$20.00</p>
        <button class="action-btn add-to-cart" onclick="addToCart('Product 3', 20)">Add to Cart</button>
        <button class="action-btn try-on">Try On</button>
      </div>
      <!-- Add More Products -->
      <div class="product">
        <img src="product4.jpg" alt="Product 4">
        <h3>Product 4</h3>
        <p>$12.00</p>
        <button class="action-btn add-to-cart" onclick="addToCart('Product 4', 12)">Add to Cart</button>
        <button class="action-btn try-on">Try On</button>
      </div>
      <div class="product">
        <img src="product5.jpg" alt="Product 5">
        <h3>Product 5</h3>
        <p>$18.00</p>
        <button class="action-btn add-to-cart" onclick="addToCart('Product 5', 18)">Add to Cart</button>
        <button class="action-btn try-on">Try On</button>
      </div>
      <div class="product">
        <img src="product6.jpg" alt="Product 6">
        <h3>Product 6</h3>
        <p>$25.00</p>
        <button class="action-btn add-to-cart" onclick="addToCart('Product 6', 25)">Add to Cart</button>
        <button class="action-btn try-on">Try On</button>
      </div>
    </div>
    <div id="cart-popup" class="hidden">
      <h3>Shopping Cart</h3>
      <div id="cart-items"></div>
      <p id="total-price">Total: $0.00</p>
      <button id="close-cart" onclick="hideCart()">Close</button>
    </div>
  </div>
</body>
<script src="/shop/shop.js"></script>
</html>
