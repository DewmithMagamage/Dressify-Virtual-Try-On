name: Frontend CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
      - name: Install Dependencies
        run: |
          npm install
          npm install --save-dev @testing-library/react
          npm install react-router-dom
      - name: Run Tests
        run: npm test
      - name: Build Frontend App (Port 3000)
        run: |
          npm run build